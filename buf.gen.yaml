# `task proto:gen`. Plugins are local binaries pinned by scripts/install-tools.sh,
# and the output is committed, so every build and every consumer of sdk/go sees
# the same generated code. `task proto:check` fails on drift.
version: v2
clean: true
plugins:
  - local: protoc-gen-go
    out: sdk/go/gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: sdk/go/gen
    opt: paths=source_relative
inputs:
  - directory: proto
