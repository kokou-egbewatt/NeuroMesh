{{- if .Values.alertSink.enabled }}
# Alertmanager's receiver until there is a pager: one JSON line per alert on stdout.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vm-alert-sink
  labels: { app.kubernetes.io/name: alert-sink, app.kubernetes.io/part-of: neuromesh }
data:
  sink.py: |
    import json, sys
    from datetime import datetime, timezone
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    LEVEL = {"critical": "ERROR", "warning": "WARN"}

    class Sink(BaseHTTPRequestHandler):
        def do_POST(self):
            if self.path != "/alert":
                self.send_response(404); self.end_headers(); return
            body = json.loads(self.rfile.read(int(self.headers.get("Content-Length", 0))) or b"{}")
            for a in body.get("alerts", []):
                labels = a.get("labels", {})
                print(json.dumps({
                    "ts": datetime.now(timezone.utc).isoformat(),
                    "level": LEVEL.get(labels.get("severity"), "INFO"),
                    "service": "alert-sink",
                    "msg": labels.get("alertname", "alert"),
                    "status": a.get("status"),
                    "labels": labels,
                    "annotations": a.get("annotations", {}),
                    "starts_at": a.get("startsAt"),
                    "ends_at": a.get("endsAt"),
                }), flush=True)
            self.send_response(200); self.end_headers()

        def do_GET(self):
            self.send_response(200 if self.path == "/healthz" else 404); self.end_headers()

        def log_message(self, *args):
            pass

    ThreadingHTTPServer(("", int(sys.argv[1])), Sink).serve_forever()
---
apiVersion: v1
kind: Service
metadata:
  name: vm-alert-sink
  labels: { app.kubernetes.io/name: alert-sink, app.kubernetes.io/part-of: neuromesh }
spec:
  selector: { app.kubernetes.io/name: alert-sink }
  ports:
    - { name: http, port: {{ .Values.alertSink.port }}, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vm-alert-sink
  labels: { app.kubernetes.io/name: alert-sink, app.kubernetes.io/part-of: neuromesh }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: alert-sink }
  template:
    metadata:
      labels: { app.kubernetes.io/name: alert-sink, app.kubernetes.io/part-of: neuromesh }
      annotations:
        checksum/script: {{ .Files.Get "templates/alert-sink.yaml" | sha256sum | trunc 12 }}
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534 }
      containers:
        - name: sink
          image: {{ .Values.alertSink.image }}
          command: [python3, -u, /app/sink.py, "{{ .Values.alertSink.port }}"]
          ports: [{ name: http, containerPort: {{ .Values.alertSink.port }} }]
          readinessProbe: { httpGet: { path: /healthz, port: http } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 5m, memory: 24Mi }
            limits: { memory: 64Mi }
          volumeMounts: [{ name: app, mountPath: /app }]
      volumes:
        - name: app
          configMap: { name: vm-alert-sink }
{{- end }}
