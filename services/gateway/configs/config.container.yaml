# Baked into the image. /certs is the mount point for a cert-manager Secret
# (tls.crt, tls.key, ca.crt); `task images:smoke` copies dev certificates there.
addr: ":8443"
log_level: info
shutdown_timeout: 10s
tls:
  cert_file: /certs/tls.crt
  key_file: /certs/tls.key
http:
  read_header_timeout: 5s
  read_timeout: 30s
  idle_timeout: 120s
  max_header_bytes: 65536
limits:
  max_body_bytes: 1048576
  max_prompt_bytes: 524288
  upstream_timeout: 30s
runtime:
  addr: runtime:50051
  server_name: runtime
  tls:
    cert_file: /certs/tls.crt
    key_file: /certs/tls.key
    ca_file: /certs/ca.crt
