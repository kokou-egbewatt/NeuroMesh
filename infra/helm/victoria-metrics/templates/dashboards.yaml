{{- /* Each JSON under files/dashboards/ becomes a ConfigMap the Grafana sidecar loads. */}}
{{- range $path, $_ := .Files.Glob "files/dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-{{ base $path | trimSuffix ".json" }}
  labels: { grafana_dashboard: "1", app.kubernetes.io/part-of: neuromesh }
data:
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
