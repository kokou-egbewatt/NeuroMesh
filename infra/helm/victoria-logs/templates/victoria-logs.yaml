# Grafana's VictoriaLogs datasource, loaded by the sidecar. The plugin itself is pinned in
# infra/helm/victoria-metrics (grafana.plugins).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-victorialogs
  labels: { grafana_datasource: "1", app.kubernetes.io/part-of: neuromesh }
data:
  victorialogs.yaml: |
    apiVersion: 1
    datasources:
      - name: VictoriaLogs
        type: victoriametrics-logs-datasource
        uid: victorialogs
        access: proxy
        url: http://victorialogs-server.{{ .Release.Namespace }}.svc.cluster.local:9428
        jsonData:
          maxLines: 1000
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: victorialogs
  labels: { app.kubernetes.io/part-of: neuromesh }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: victoria-logs-single }
  policyTypes: [Ingress]
  ingress:
    - from:
        # the only writer
        - podSelector: { matchLabels: { app.kubernetes.io/name: otel-gateway } }
        # readers
        - podSelector: { matchLabels: { app.kubernetes.io/name: grafana } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: vmagent } }
        {{- with .Values.networkPolicy.nodeIP }}
        # the edge's Envoy runs on the node's network, so its traffic arrives from the node's address
        - ipBlock: { cidr: {{ . }}/32 }
        {{- end }}
      ports: [{ port: 9428, protocol: TCP }]
{{- end }}
{{- if and .Values.edge.enabled (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1/HTTPRoute") }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victorialogs
  labels: { app.kubernetes.io/part-of: neuromesh }
spec:
  parentRefs:
    - name: {{ .Values.edge.gateway.name }}
      namespace: {{ .Values.edge.gateway.namespace }}
      sectionName: https
  hostnames: ["victorialogs.{{ .Values.edge.domain }}"]
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: victorialogs-server, port: 9428 }]
{{- end }}
