# Live reload for `task dev`. Runs from the repository root so a change in
# the service, a shared package or the SDK rebuilds it.
root = "."
tmp_dir = "tmp/air/runtime"

[build]
  cmd = "go build -o ./tmp/air/runtime/server ./services/runtime/cmd/server"
  entrypoint = ["./tmp/air/runtime/server", "-config", "services/runtime/configs/config.yaml"]
  include_dir = ["services/runtime", "packages", "sdk/go"]
  include_ext = ["go", "yaml"]
  exclude_dir = ["tmp", "testdata"]
  exclude_regex = ['_test\.go$']
  delay = 300
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true

  [build.windows]
    cmd = "go build -o ./tmp/air/runtime/server.exe ./services/runtime/cmd/server"
    entrypoint = ["./tmp/air/runtime/server.exe", "-config", "services/runtime/configs/config.yaml"]

[log]
  main_only = true

[misc]
  clean_on_exit = true
