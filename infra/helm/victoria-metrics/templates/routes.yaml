{{- /*
Hostnames on the local edge (infra/helm/edge). Rendered only when the cluster has the Gateway API,
so the profile still installs before the edge does. task obs:access lists a UI as reachable once its
route exists.
*/}}
{{- if and .Values.edge.enabled (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1/HTTPRoute") }}
{{- range .Values.edge.routes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}
  labels: { app.kubernetes.io/part-of: neuromesh }
spec:
  parentRefs:
    - name: {{ $.Values.edge.gateway.name }}
      namespace: {{ $.Values.edge.gateway.namespace }}
      sectionName: https
  hostnames: ["{{ .name }}.{{ $.Values.edge.domain }}"]
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: {{ .service }}, port: {{ .port }} }]
{{- end }}
{{- end }}
