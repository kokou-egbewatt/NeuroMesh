# services/runtime (#14). scripts/services.sh builds the image, imports it into k3s and sets
# image.tag to the commit; nothing is pulled from a registry.
replicaCount: 2

image:
  repository: neuromesh-runtime
  tag: ""
  pullPolicy: Never

# The Secret holding tls.crt, tls.key and ca.crt, mounted at /certs (the image's config expects it
# there). scripts/services.sh creates it from certs/dev/runtime.
tlsSecret: runtime-tls

# Measured on the reference machine (docs/onboarding/local-cluster.md#the-services): idle it uses
# about 1m and 8 to 13 MiB; under the 64-client route benchmark it peaked at 890m and 9 MiB per pod.
# The request is what it needs to start and serve light traffic; CPU has no limit, so a burst uses
# idle cores instead of being throttled.
resources:
  requests: { cpu: 50m, memory: 32Mi }
  limits: { memory: 128Mi }

# Prometheus /metrics on its own port, scraped by vmagent through the VMServiceScrape (#10).
metrics:
  enabled: true
  port: 9090
  path: /metrics
  interval: 30s

# Spans by OTLP to the collector gateway (infra/helm/otel-collector). Empty turns tracing off.
otel:
  endpoint: otel-gateway.observability:4317
  # The share of new traces kept. Tracing every request cost up to 27% p50 on the stub benchmark at
  # 64 clients; 10% costs nothing measurable (#10). A client's sampled traceparent is always followed.
  sampleRatio: "0.1"

# What generates the text (#1): stub, the fixed answer the golden files and the baseline use, or
# ollama, the Ollama chart in this namespace (`task ollama:up`). `BACKEND=ollama task svc:up` sets it.
backend:
  kind: stub
  ollamaURL: http://ollama:11434
