# Grafana's Tempo datasource, loaded by the sidecar: a span links to its log lines in VictoriaLogs by
# trace_id.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-tempo
  labels: { grafana_datasource: "1", app.kubernetes.io/part-of: neuromesh }
data:
  tempo.yaml: |
    apiVersion: 1
    datasources:
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo.{{ .Release.Namespace }}.svc.cluster.local:3200
        jsonData:
          nodeGraph: { enabled: true }
          serviceMap: { datasourceUid: victoriametrics }
          tracesToLogsV2:
            datasourceUid: victorialogs
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            filterByTraceID: false
            customQuery: true
            query: 'trace_id:"${__trace.traceId}"'
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: tempo
  labels: { app.kubernetes.io/part-of: neuromesh }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: tempo }
  endpoints:
    - port: tempo-prom-metrics
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tempo
  labels: { app.kubernetes.io/part-of: neuromesh }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: tempo }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: otel-gateway } }
      ports: [{ port: 4317, protocol: TCP }, { port: 4318, protocol: TCP }]
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: grafana } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: vmagent } }
      ports: [{ port: 3200, protocol: TCP }]
{{- end }}
