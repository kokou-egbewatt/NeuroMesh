name: Docs

# Markdown links, changelog integrity, and the version gate. Runs on every PR,
# including documentation-only ones: a broken link is a documentation change.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Links, changelog, version gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The version gate compares against origin/main.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Version
        run: task ci:summary
      - run: task ci:docs
